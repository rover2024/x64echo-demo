name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libffi-dev
      - name: Build host and guest runtimes
        run: |
          cmake -S . -B build/ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DECHO_CHECK_DLADDR=ON \
            -DECHO_BUILD_QEMU_MODULES=OFF
          cmake --build build/ci --parallel
      - name: Check shell syntax
        run: |
          while IFS= read -r file; do
            bash -n "$file"
          done < <(find scripts examples tests benchmarks llvm/scripts -name '*.sh' -type f)
